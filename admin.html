<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16294d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمين الصندوق">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="admin-apple-touch-icon.png">
<link rel="icon" type="image/png" href="admin-192.png">
<title>إدارة العمارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<script>
try { var _th = localStorage.getItem('bf_theme'); if (_th === 'light' || _th === 'dark') document.documentElement.setAttribute('data-theme', _th); } catch (e) {}
</script>
<style>
:root{
  --bg:#f6f4f8;--card:#ffffff;--tx:#1a1f33;--mut:#6e7388;--br:#ece8ef;
  --ac:#243f7b;--ac2:#3d63b8;--rose:#d6457a;--rose2:#ff8db0;--ok:#12a150;--okbg:#e6f6ed;--bad:#d93a3a;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff5e0;
  --sh:0 8px 28px rgba(22,41,77,.09);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1220;--card:#171d30;--tx:#eef1fa;--mut:#9aa3ba;--br:#262e47;
  --ac:#7da2ff;--ac2:#a3bcff;--rose:#ff7aa8;--rose2:#ffb3cb;--ok:#4cd08a;--okbg:#12301f;--bad:#ff7b7b;--badbg:#341a1d;--warn:#f1c05a;--warnbg:#352a12;
  --sh:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e1220;--card:#171d30;--tx:#eef1fa;--mut:#9aa3ba;--br:#262e47;
  --ac:#7da2ff;--ac2:#a3bcff;--rose:#ff7aa8;--rose2:#ffb3cb;--ok:#4cd08a;--okbg:#12301f;--bad:#ff7b7b;--badbg:#341a1d;--warn:#f1c05a;--warnbg:#352a12;
  --sh:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;
  padding:0 0 max(24px,env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* brand header */
.brand{position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(max(18px,env(safe-area-inset-top)) + 8px) 20px 62px;border-radius:0 0 34px 34px;
  background:linear-gradient(160deg,#122548 0%,#1f3a72 55%,#33559b 100%);box-shadow:0 10px 30px rgba(22,41,77,.25)}
.brand::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:
   radial-gradient(circle at 12% 30%,rgba(255,141,176,.35) 0 5px,transparent 6px),
   radial-gradient(circle at 88% 22%,rgba(255,141,176,.28) 0 8px,transparent 9px),
   radial-gradient(circle at 78% 78%,rgba(255,255,255,.14) 0 4px,transparent 5px),
   radial-gradient(circle at 20% 82%,rgba(255,255,255,.12) 0 6px,transparent 7px),
   radial-gradient(120% 90% at 100% 0%,rgba(255,141,176,.18),transparent 60%)}
.brand>*{position:relative}
.emb{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,179,203,.55);box-shadow:0 0 0 7px rgba(255,255,255,.06)}
.brand h1{margin:0;font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:700;font-size:30px;line-height:1.35}
.brand .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:var(--rose2);font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:600;font-size:15px}
.brand .sub i{display:block;width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--rose2))}
.brand .sub i:last-child{background:linear-gradient(270deg,transparent,var(--rose2))}
footer{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--br);animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.mut{color:var(--mut);font-size:13px}

/* login */
.login{margin-top:-34px;position:relative;text-align:center}
.login h2{margin:0 0 4px;font-size:20px}
h2::before{content:"";display:inline-block;width:4px;height:16px;border-radius:4px;background:var(--rose);margin-inline-end:8px;vertical-align:-2px}
.field{text-align:right;margin-top:14px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:14px;font-size:18px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none;text-align:center;letter-spacing:2px}
input:focus{border-color:var(--ac)}
.btn{width:100%;margin-top:18px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(36,63,123,.30)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);margin-top:12px;font-size:14px;min-height:20px}

/* hero */
.hero{position:relative;border-radius:24px;padding:22px 18px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:var(--sh);animation:up .45s ease both}
.hero.ok{background:linear-gradient(135deg,#0f9d58,#34c77b)}
.hero.bad{background:linear-gradient(135deg,#d93a3a,#ff7a59)}
.hero .apt{font-size:14px;opacity:.9}
.hero .big{font-size:30px;font-weight:800;margin:6px 0 2px}
.hero .sub{font-size:14px;opacity:.95}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:16px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .9s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:16px}.stat span{font-size:12px;opacity:.9}

/* announcement */
.note{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;font-weight:500;display:flex;gap:10px;align-items:flex-start;white-space:pre-line}

/* items */
.item{padding:14px 0;border-bottom:1px solid var(--br)}
.item:last-child{border-bottom:0;padding-bottom:0}.item:first-of-type{padding-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:16px}
.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.late{background:var(--bad);color:#fff}.chip.wait{background:var(--warnbg);color:var(--warn)}
.meta{font-size:13px;color:var(--mut);margin:6px 0 8px}
.pb{height:7px;border-radius:99px;background:var(--br);overflow:hidden}
.pb>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.paid-btn{margin-top:10px;display:inline-flex;gap:6px;align-items:center;font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;
  background:var(--okbg);color:var(--ok);border:0;text-decoration:none;cursor:pointer}

/* rows */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.prow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.pn{font-weight:700;font-size:15px}.pa{color:var(--ok);font-weight:700;font-size:15px}
.payinfo{white-space:pre-line;background:var(--bg);border-radius:14px;padding:12px;font-size:15px;line-height:1.7}
.copy{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.pm{border:1.5px solid var(--br);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.pm .ty{font-size:13px;color:var(--mut);font-weight:700}
.pm .nu{font-size:22px;font-weight:800;letter-spacing:1px;direction:ltr;text-align:right;margin:4px 0 0;word-break:break-all;user-select:all}
.pm .copy{margin-top:8px;padding:10px}
.fund{display:flex;align-items:center;gap:12px}
.fund .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--okbg);font-size:22px}
.fund b{font-size:20px;display:block}
.out{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font-family:inherit;font-size:14px;cursor:pointer;padding:10px}
#view>.hero:first-child{margin-top:-34px}
/* amount modal */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);animation:up .25s ease both}
.sheet h2{margin-bottom:6px}
.sheet .btn{margin-top:14px}
.sheet .cancel{display:block;width:100%;margin-top:6px;background:none;border:0;color:var(--mut);font-family:inherit;font-size:15px;padding:10px;cursor:pointer}
.chip.rej{background:var(--badbg);color:var(--bad)}
.rejnote{margin-top:8px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:14px;white-space:pre-line}
[hidden]{display:none!important}

/* admin */
textarea{width:100%;padding:12px;font-size:16px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none;resize:vertical;min-height:80px;text-align:right}
textarea:focus{border-color:var(--ac)}
select{width:100%;padding:13px;font-size:16px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
.sdel{padding:7px 12px;border:0;border-radius:10px;background:var(--badbg);color:var(--bad);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
input.t{text-align:right;letter-spacing:0;font-size:16px}
.hi{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;padding:0 4px}
.hi b{font-size:17px}
.hi button{background:none;border:0;color:var(--mut);font-family:inherit;font-size:14px;cursor:pointer;padding:6px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--br)}
.tg:last-of-type{border-bottom:0}
.tg .tt{font-weight:700;font-size:15px}.tg .ts{font-size:12.5px;color:var(--mut)}
.sw{flex:none;width:54px;height:30px;border-radius:99px;border:0;background:var(--br);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(-24px)}
.sw:disabled{opacity:.5}
.cl{padding:14px 0;border-bottom:1px solid var(--br)}
.cl:last-child{border-bottom:0;padding-bottom:0}.cl:first-of-type{padding-top:0}
.cl .acts{display:flex;gap:8px;margin-top:10px}
.xb{margin-inline-end:6px;margin-top:6px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}.xb.on{background:var(--ac);color:#fff}.xb.cl2{border-color:var(--bad);color:var(--bad)}
.cl .acts button{flex:1;padding:11px;border-radius:12px;border:0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.cl .yes{background:var(--ok);color:#fff}.cl .no{background:var(--badbg);color:var(--bad)}
.cl a{color:var(--ac);font-weight:700;font-size:14px;margin-inline-end:12px;text-decoration:none}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--br)}
.lr:last-child{border-bottom:0}
.lr .nm{font-weight:700;font-size:15px}.lr .rm{color:var(--bad);font-weight:800;font-size:15px}
.wa{flex:none;padding:8px 12px;border-radius:12px;border:0;background:#e6f6ed;color:#0b7a3c;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.wa:disabled{background:var(--br);color:var(--mut)}
.wide{display:block;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;background:#e6f6ed;color:#0b7a3c;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.wk{margin-inline-start:8px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.addp{display:block;width:100%;margin-bottom:14px;padding:15px;border-radius:16px;border:1.5px dashed var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
.ok-toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a44;color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:60;box-shadow:var(--sh);max-width:90vw;text-align:center}
.sheet{max-height:92vh;overflow:auto}
.pg{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px}
.netbar{position:fixed;top:0;inset-inline:0;z-index:70;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;text-align:center;font-size:13px;font-weight:700;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--br)}
.netbar[hidden]{display:none}

.dvc{border-radius:16px;margin-top:10px;padding:14px;background:var(--okbg);border:1.5px solid transparent}.dvc.pend{background:var(--badbg);border-color:var(--bad)}
.dvr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--br)}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:1.5px solid var(--br);background:var(--card,transparent);flex-shrink:0}
.seg button{border:0;background:transparent;color:inherit;opacity:.55;padding:9px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.seg button+button{border-inline-start:1.5px solid var(--br)}
.seg button.on-ok{background:var(--ok);color:#fff;opacity:1}.seg button.on-bad{background:var(--bad);color:#fff;opacity:1}.seg button.on-off{background:var(--mut);color:#fff;opacity:1}


/* sections */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.tile{border:1px solid var(--br);background:var(--card);border-radius:16px;padding:10px 2px;text-align:center;font-family:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
.tile b{display:block;font-size:20px;line-height:1.3}.tile span{font-size:11px;color:var(--mut);font-weight:700}
.tile.hot{border-color:var(--bad);background:var(--badbg)}.tile.hot b{color:var(--bad)}
details.sec{background:var(--card);border:1px solid var(--br);border-radius:18px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
details.sec.alert{border:2px solid var(--bad)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;font-weight:800;font-size:16px}
details.sec>summary::-webkit-details-marker{display:none}
.sec .si{font-size:20px;line-height:1}.sec .st{flex:1}
.sec .bd{min-width:24px;padding:2px 8px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px;text-align:center}
.sec .bd.hot{background:var(--bad)}
.sec .chev{width:9px;height:9px;border-inline-end:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-inline-start:4px;margin-top:-3px}
details.sec[open]>summary .chev{transform:rotate(-135deg);margin-top:3px}
details.sec[open]>summary{border-bottom:1px solid var(--br)}
details.sec>.sbd{padding:14px 16px}
/* side menu */
.dwbtn{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:40;width:44px;height:44px;border-radius:14px;border:1px solid var(--br);background:var(--card);color:var(--tx);box-shadow:var(--sh);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center}
.dwov{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:60}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,320px);background:var(--card);z-index:61;box-shadow:var(--sh);padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-y:auto;transition:transform .28s ease;display:flex;flex-direction:column;gap:6px;transform:translateX(105%)}
.drawer.open{transform:none}
.dwh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--br);margin-bottom:6px}
.dwh b{font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-size:18px}
.dwh .x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:4px 8px;font-family:inherit}
.dws{padding:12px 0;border-bottom:1px solid var(--br)}
.dwl{font-size:13px;color:var(--mut);font-weight:700;margin-bottom:8px}
.tseg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.tseg button{flex:1;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tseg button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 6px rgba(0,0,0,.14)}
.dwi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;background:none;border:0;color:var(--tx);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:start}
.dwi.danger{color:var(--bad)}
.pwr{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px 0 4px;background:none;border:0;cursor:pointer;color:var(--mut);opacity:.5;transition:opacity .2s}
.pwr:hover,.pwr:active{opacity:.9}
.pwr .p1{display:flex;align-items:center;gap:8px;font-family:'Tajawal',sans-serif;font-size:9px;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
.pwr .p1::before,.pwr .p1::after{content:"";width:22px;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.pwr .p1::after{background:linear-gradient(270deg,transparent,currentColor)}
.pwr .p2{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;letter-spacing:.06em;background:linear-gradient(90deg,var(--rose),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.pwr .p2 i{font-style:normal;font-size:9px;vertical-align:middle;margin:0 3px;color:var(--rose);-webkit-text-fill-color:var(--rose)}
.cxs{display:flex;gap:10px;margin-top:14px}
.cxs a{flex:1;text-align:center;padding:13px 6px;border-radius:14px;color:#fff;text-decoration:none;font-weight:800;font-size:15px}
.cxs a.wa2{background:linear-gradient(135deg,#128c7e,#25d366)}
.cxs a.tg2{background:linear-gradient(135deg,#1c7fc4,#2aabee)}
</style>
</head>
<body>
<div id="netbar" class="netbar" role="status" hidden></div>
<button id="dwbtn" class="dwbtn" aria-label="القائمة" hidden>☰</button>
<header class="brand">
  <div class="emb" id="emb"></div>
  <h1 id="bn"></h1>
  <div class="sub"><i></i>لوحة أمين الصندوق<i></i></div>
</header>
<div class="wrap">
  <div id="login" class="card login">
    <h2>دخول الإدارة</h2>
    <div class="mut">اكتب رمز الإدارة</div>
    <div class="field"><label>الرمز</label><input id="code" type="password" autocomplete="off"></div>
    <button id="go" class="btn">دخول</button>
    <div id="err" class="err"></div>
  </div>
  <div id="view" hidden></div>
  <footer id="bf"></footer>
</div>

<div id="dwov" class="dwov" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>

<script>
// ضع هنا نفس رابط الـ Web App المستخدم في index.html
// ===== بيانات العمارة (غيّرها لكل عمارة) =====

async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ code: CODE, tok: CODE ? '' : TOK, did: DID }, body)) });
  return r.json();
}
function toast(t) {
  const x = document.createElement('div'); x.className = 'ok-toast'; x.textContent = t;
  document.body.appendChild(x); setTimeout(() => x.remove(), 2600);
}
function waLink(x) {
  const m = 'السلام عليكم، شقة ' + x.apt + '. نشكر لكم مساهمتكم في صندوق ' + (D.building || 'العمارة') + '، فهي استثمار في راحة الجميع وسلامة المبنى. يتبقى من إسهامكم ' + x.remaining + ' جنيه' +
    (D.pageUrl ? '، ويسعدنا متابعتكم للتفاصيل والمساهمة عبر: ' + D.pageUrl : '.');
  return 'https://wa.me/' + x.phone + '?text=' + encodeURIComponent(m);
}

async function load(code, auto, silent) {
  if (!silent) { $('err').textContent = ''; $('go').disabled = true; }
  CODE = code;
  try {
    const d = await api({ action: 'a_list' });
    if (!d.ok) {
      if (d.error === 'expired' || (auto && d.error === 'bad')) { try { localStorage.removeItem(KEY); } catch (e) {} TOK = ''; }
      if (!silent || d.error === 'expired') { $('err').textContent = ERR[d.error] || 'تعذر الدخول.'; $('login').hidden = false; $('view').hidden = true; }
    } else {
      if (d.tok) { TOK = d.tok; try { localStorage.setItem(KEY, TOK); } catch (e) {} }
      CODE = '';
      D = d; render(); markFresh();
    }
  } catch (e) { if (!silent) $('err').textContent = 'تعذر الاتصال، حاول مرة أخرى.'; NETFAIL = true; netBar(); }
  if (!silent) $('go').disabled = false;
}
const reload = () => load('', false, true);

  BUSY = false;

    ? '<h2>عدد ' + n + ' شقة عليها متبقي</h2><div class=\"mut\">«' + esc(desc) + '»: تحفظه كمنتهٍ على أي حال، أم تبقيه مفتوح للدفع؟</div><button class=\"btn\" id=\"cfs\">حفظ على أي حال (إغلاق)</button><button class=\"cancel\" id=\"cfk\">إبقاء المشروع مفتوح للدفع</button>'
    : '<h2>إغلاق المشروع</h2><div class=\"mut\">«' + esc(desc) + '»: كل الشقق مكتملة. يُنقل للمشاريع المنتهية ولا يقبل دفعاً بعد كده.</div><button class=\"btn\" id=\"cfs\">إغلاق المشروع</button><button class=\"cancel\" id=\"cfk\">إلغاء</button>');

    s.close(); BUSY = true;
    try { const r = await api({ action: 'a_close', item: code, force: true }); toast(r.ok ? 'تم إغلاق المشروع وتسجيله في المشاريع المنتهية' : (ERR[r.error] || 'تعذر الحفظ')); await reload(); } catch (e) { toast('تعذر الاتصال'); }

function sheet(html) {
  const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  return { ov, close };
}

function curNotify() { return (D.notify || []).find(i => i.code === NSEL) || (D.notify || [])[0]; }
function nWaLink(it, x) {
  const m = 'السلام عليكم، شقة ' + x.apt + '. تم فتح بند جديد في صندوق ' + (D.building || 'العمارة') + ': «' + it.desc + '». المطلوب منكم ' + it.amount + ' جنيه' +

async function notifyOne(it, x, quiet) {

function addSched() {

    '<div class="field" id="stw"><label id="stl"></label><select id="st"></select></div>' +
    '<div class="field" id="sxw"><label>النص</label><textarea id="sx" maxlength="1500" placeholder="اكتب النص هنا"></textarea></div>' +

  const sync = () => {
    const a = $('sa').value, tg = $('st');

    if (a === 'إعلان') { $('stl').textContent = 'رقم الإعلان (النص فاضي = مسح الإعلان)'; tg.innerHTML = opts(['1', '2', '3']); }
    else { $('stl').textContent = a === 'إظهار' ? 'ما الذي يظهر' : 'ما الذي يختفي'; tg.innerHTML = opts(KEYS); }
  };
  $('sa').onchange = sync;
  sync();
  $('scx').onclick = s.close;
  $('ssv').onclick = async () => {
    const a = $('sa').value;
    let tg = $('st').value;
    $('ssv').disabled = true; $('serr').textContent = '';

  return 'منذ ' + (d ? d + (d === 1 ? ' يوم' : ' أيام') : h ? h + (h === 1 ? ' ساعة' : h === 2 ? ' ساعتين' : ' ساعات') : m + (m === 1 ? ' دقيقة' : m === 2 ? ' دقيقتين' : m <= 10 ? ' دقائق' : ' دقيقة'));

const TKEY = 'bf_theme';

const SKEY = 'bf_snd';
let SND = true, AC = null, LAST_SEQ = null;

function unlockAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function beep() {
  if (!SND) return; unlockAudio();
  try {
    const t0 = AC.currentTime;
    [[880, 0], [1175, 0.16], [1568, 0.32]].forEach(p => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = p[0]; g.gain.setValueAtTime(0.0001, t0 + p[1]); g.gain.exponentialRampToValueAtTime(0.4, t0 + p[1] + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + p[1] + 0.35); o.connect(g); g.connect(AC.destination); o.start(t0 + p[1]); o.stop(t0 + p[1] + 0.4); });
  } catch (e) {}
}
let PING_BUSY = false;

  if (!TOK || PING_BUSY || $('view').hidden) return;

    if (d && d.ok) {
      if (LAST_SEQ === null) LAST_SEQ = d.seq;
      else if (d.seq !== LAST_SEQ) {
        LAST_SEQ = d.seq;
        beep(); toast('🔔 ' + (d.kind || 'حدث جديد'));
        if (!BUSY && !document.querySelector('.ov') && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) reload();
      }
    }
  } catch (e) {}
  PING_BUSY = false;
}
