<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<script>
// نطبّق الوضع واللغة المحفوظين قبل الرسم عشان ما يحصلش وميض
try {
  var _th = localStorage.getItem('bf_theme'); if (_th === 'light' || _th === 'dark') document.documentElement.setAttribute('data-theme', _th);
  if (localStorage.getItem('bf_lang') === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }

<style>
:root{
  --bg:#f6f4f8;--card:#ffffff;--tx:#1a1f33;--mut:#6e7388;--br:#ece8ef;
  --ac:#243f7b;--ac2:#3d63b8;--rose:#d6457a;--rose2:#ff8db0;--ok:#12a150;--okbg:#e6f6ed;--bad:#d93a3a;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff5e0;
  --sh:0 8px 28px rgba(22,41,77,.09);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1220;--card:#171d30;--tx:#eef1fa;--mut:#9aa3ba;--br:#262e47;
  --ac:#7da2ff;--ac2:#a3bcff;--rose:#ff7aa8;--rose2:#ffb3cb;--ok:#4cd08a;--okbg:#12301f;--bad:#ff7b7b;--badbg:#341a1d;--warn:#f1c05a;--warnbg:#352a12;
  --sh:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0e1220;--card:#171d30;--tx:#eef1fa;--mut:#9aa3ba;--br:#262e47;
  --ac:#7da2ff;--ac2:#a3bcff;--rose:#ff7aa8;--rose2:#ffb3cb;--ok:#4cd08a;--okbg:#12301f;--bad:#ff7b7b;--badbg:#341a1d;--warn:#f1c05a;--warnbg:#352a12;
  --sh:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;
  padding:0 0 max(24px,env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* brand header */
.brand{position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(max(18px,env(safe-area-inset-top)) + 8px) 20px 62px;border-radius:0 0 34px 34px;
  background:linear-gradient(160deg,#122548 0%,#1f3a72 55%,#33559b 100%);box-shadow:0 10px 30px rgba(22,41,77,.25)}
.brand::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:
   radial-gradient(circle at 12% 30%,rgba(255,141,176,.35) 0 5px,transparent 6px),
   radial-gradient(circle at 88% 22%,rgba(255,141,176,.28) 0 8px,transparent 9px),
   radial-gradient(circle at 78% 78%,rgba(255,255,255,.14) 0 4px,transparent 5px),
   radial-gradient(circle at 20% 82%,rgba(255,255,255,.12) 0 6px,transparent 7px),
   radial-gradient(120% 90% at 100% 0%,rgba(255,141,176,.18),transparent 60%)}
.brand>*{position:relative}
.emb{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,179,203,.55);box-shadow:0 0 0 7px rgba(255,255,255,.06)}
.brand h1{margin:0;font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:700;font-size:30px;line-height:1.35}
.brand .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:var(--rose2);font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:600;font-size:15px}
.brand .sub i{display:block;width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--rose2))}
.brand .sub i:last-child{background:linear-gradient(270deg,transparent,var(--rose2))}
footer{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--br);animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.mut{color:var(--mut);font-size:13px}

/* login */
.login{margin-top:-34px;position:relative;text-align:center}
.login h2{margin:0 0 4px;font-size:20px}
h2::before{content:"";display:inline-block;width:4px;height:16px;border-radius:4px;background:var(--rose);margin-inline-end:8px;vertical-align:-2px}
.field{text-align:start;margin-top:14px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:14px;font-size:18px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none;text-align:center;letter-spacing:2px}
input:focus{border-color:var(--ac)}
select{width:100%;padding:14px;font-size:17px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
.btn{width:100%;margin-top:18px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(36,63,123,.30)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);margin-top:12px;font-size:14px;min-height:20px}

/* hero */
.hero{position:relative;border-radius:24px;padding:22px 18px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:var(--sh);animation:up .45s ease both}
.hero.ok{background:linear-gradient(135deg,#0f9d58,#34c77b)}
.hero.bad{background:linear-gradient(135deg,#d93a3a,#ff7a59)}
.hero .apt{font-size:14px;opacity:.9}
.hero .big{font-size:30px;font-weight:800;margin:6px 0 2px}
.hero .sub{font-size:14px;opacity:.95}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:16px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .9s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:16px}.stat span{font-size:12px;opacity:.9}

/* announcement */
.qt{background:var(--card);border:1px solid var(--br);border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--sh);text-align:center}
.qt .q{font-size:18px;line-height:2;font-weight:600}
.qt .qs{margin-top:8px;font-size:13px;color:var(--mut)}
.note{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;font-weight:500;display:flex;gap:10px;align-items:flex-start;white-space:pre-line}

/* ticker */
.tick{display:flex;align-items:center;gap:10px;background:var(--warnbg);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;font-weight:500;overflow:hidden}
.tick .ti{flex:none}
.tv{flex:1;min-width:0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tt{display:inline-flex;white-space:nowrap;will-change:transform}
.ts{display:inline-flex;align-items:center}
.tx{padding:0 6px}
.sep{padding:0 14px;opacity:.55;font-size:12px}
@keyframes tkr{to{transform:translateX(50%)}}
@keyframes tkl{to{transform:translateX(-50%)}}
[dir=rtl] .tick:not(.still) .tt{animation:tkr var(--d,20s) linear infinite}
[dir=ltr] .tick:not(.still) .tt{animation:tkl var(--d,20s) linear infinite}
.tick:not(.still):hover .tt,.tick:not(.still):active .tt{animation-play-state:paused}
.tick.still .tv{white-space:normal;-webkit-mask-image:none;mask-image:none}
.tick.still .tt{display:block;white-space:normal}
.tick.still .ts{display:block}
.tick.still .tx{padding:0;line-height:1.7}

/* items */
.item{padding:14px 0;border-bottom:1px solid var(--br)}
.item:last-child{border-bottom:0;padding-bottom:0}.item:first-of-type{padding-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:16px}
.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.late{background:var(--bad);color:#fff}.chip.wait{background:var(--warnbg);color:var(--warn)}
.meta{font-size:13px;color:var(--mut);margin:6px 0 8px}
.pb{height:7px;border-radius:99px;background:var(--br);overflow:hidden}
.pb>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.paid-btn{margin-top:10px;display:inline-flex;gap:6px;align-items:center;font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;
  background:var(--okbg);color:var(--ok);border:0;text-decoration:none;cursor:pointer}

/* rows */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.prow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.pn{font-weight:700;font-size:15px}.pa{color:var(--ok);font-weight:700;font-size:15px}
.payinfo{white-space:pre-line;background:var(--bg);border-radius:14px;padding:12px;font-size:15px;line-height:1.7}
.copy{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.pm{border:1.5px solid var(--br);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.pm .ty{font-size:13px;color:var(--mut);font-weight:700}
.pm .nu{font-size:22px;font-weight:800;letter-spacing:1px;direction:ltr;margin:4px 0 0;word-break:break-all;user-select:all}
[dir=rtl] .pm .nu{text-align:right}
[dir=ltr] .pm .nu{text-align:left}
.pm .copy{margin-top:8px;padding:10px}
.fund{display:flex;align-items:center;gap:12px}
.fund .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--okbg);font-size:22px}
.fund b{font-size:20px;display:block}
.out{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font-family:inherit;font-size:14px;cursor:pointer;padding:10px}
#view>.hero:first-child{margin-top:-34px}
/* amount modal */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);animation:up .25s ease both}
.sheet h2{margin-bottom:6px}
.sheet .btn{margin-top:14px}
.sheet .cancel{display:block;width:100%;margin-top:6px;background:none;border:0;color:var(--mut);font-family:inherit;font-size:15px;padding:10px;cursor:pointer}
.chip.rej{background:var(--badbg);color:var(--bad)}
.rejnote{margin-top:8px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:14px;white-space:pre-line}

/* ads */
.tb{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--warn);color:var(--warnbg);margin-inline-end:6px;vertical-align:1px}
textarea.at{width:100%;min-height:96px;padding:12px;font-size:16px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none;resize:vertical;text-align:start;letter-spacing:0}
textarea.at:focus{border-color:var(--ac)}
.cnt{font-size:12px;color:var(--mut);text-align:end;margin-top:4px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1a1f33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:88vw;text-align:center}
.mad{padding:12px 0;border-bottom:1px solid var(--br)}
.mad:last-child{border-bottom:0}
.mad .tx2{margin:8px 0;line-height:1.7;font-size:15px}
.mad .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.del{background:none;border:0;color:var(--bad);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.chip.gr{background:var(--br);color:var(--mut)}
.flt{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px}
.flt button{flex:none;padding:8px 12px;border-radius:99px;border:1.5px solid var(--br);background:var(--bg);color:var(--tx);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.flt button.on{background:var(--ac);border-color:var(--ac);color:#fff}
[data-theme=dark] .flt button.on{color:#0e1220}
.sheet.tall{max-height:86vh;overflow-y:auto}

a.vw{color:var(--ac);font-weight:800;text-decoration:underline;cursor:pointer;margin-inline-start:8px;white-space:nowrap}
.prev{display:flex;align-items:center;gap:10px;margin-top:8px}
.prev img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--br)}
.pimg{max-width:100%;max-height:70vh;display:block;margin:12px auto 0;border-radius:14px}

/* side menu */
.mbtn{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-start:12px;z-index:40;width:44px;height:44px;border-radius:14px;
  border:1px solid var(--br);background:var(--card);color:var(--tx);box-shadow:var(--sh);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center}
.mov{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:60}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,320px);background:var(--card);z-index:61;box-shadow:var(--sh);
  padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-y:auto;transition:transform .28s ease;display:flex;flex-direction:column;gap:6px}
[dir=rtl] .drawer{transform:translateX(105%)}
[dir=ltr] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--br);margin-bottom:6px}
.dh b{font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-size:18px}
.dh .x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:4px 8px;font-family:inherit}
.ms{padding:12px 0;border-bottom:1px solid var(--br)}
.ml{font-size:13px;color:var(--mut);font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 1px 6px rgba(0,0,0,.14)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;background:none;border:0;color:var(--tx);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:start}
.mi.danger{color:var(--bad)}
.cbox{margin-top:6px;background:var(--bg);border-radius:14px;padding:12px}
.cbox p{margin:0 0 10px;font-size:14px;line-height:1.8}
.cbox .cr{display:flex;gap:8px}
.cbox a{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.cbox a.wa{background:linear-gradient(135deg,#128c7e,#25d366)}
[hidden]{display:none!important}
.netbar{position:fixed;top:0;inset-inline:0;z-index:70;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;text-align:center;font-size:13px;font-weight:700;background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--br)}
.netbar[hidden]{display:none}
.nts{margin:12px 0 0}
.nt{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--br);border-inline-start:4px solid var(--rose);border-radius:14px;padding:10px 12px;margin:0 0 8px;box-shadow:var(--sh);font-size:14px;line-height:1.7;cursor:pointer}
.nt.ok{border-inline-start-color:var(--ok)}.nt.bad{border-inline-start-color:var(--bad)}
.nt .nb{flex:1}.nt .ntm{color:var(--mut);font-size:12px}
.nt .nx{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:0 4px;font-family:inherit}
</style>
</head>
<body>
<div id="netbar" class="netbar" role="status" hidden></div>
<button class="mbtn" id="mbtn" aria-label="القائمة" hidden>☰</button>
<header class="brand">
  <div class="emb"><svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <defs>
          <g id="pt"><path d="M0,-4 C-9,-8 -11,-19 -6,-24 C-4,-21 -2,-22 0,-25 C2,-22 4,-21 6,-24 C11,-19 9,-8 0,-4Z"/></g>
        </defs>
        <path d="M32 40 C32 49 31 55 30 61" stroke="#7fd1a0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M31 52 C24 50 20 46 19 41 C25 41 29 45 31 52Z" fill="#7fd1a0"/>
        <g transform="translate(32 27)">
          <g fill="#ff8db0"><use href="#pt"/><use href="#pt" transform="rotate(45)"/><use href="#pt" transform="rotate(90)"/><use href="#pt" transform="rotate(135)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(225)"/><use href="#pt" transform="rotate(270)"/><use href="#pt" transform="rotate(315)"/></g>
          <g fill="#ffb3cb" transform="scale(.72)"><use href="#pt" transform="rotate(22)"/><use href="#pt" transform="rotate(67)"/><use href="#pt" transform="rotate(112)"/><use href="#pt" transform="rotate(157)"/><use href="#pt" transform="rotate(202)"/><use href="#pt" transform="rotate(247)"/><use href="#pt" transform="rotate(292)"/><use href="#pt" transform="rotate(337)"/></g>
          <circle r="4.2" fill="#ffd9e5"/>
        </g>
      </svg></div>
  <h1 data-t>عمارة 220</h1>
  <div class="sub"><i></i><span data-t>حي القرنفل</span><i></i></div>
</header>
<div class="wrap">

  <div id="login" class="card login">
    <h2 data-t>تسجيل الدخول</h2>
    <div class="mut" data-t>ادخل بيانات شقتك لمتابعة مساهماتك</div>
    <div class="field"><label data-t>رقم الشقة</label><input id="apt" inputmode="numeric" autocomplete="off"></div>
    <div class="field"><label data-t>الرقم السري</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <button id="go" class="btn" data-t>دخول</button>
    <div id="err" class="err"></div>
    <button class="out" id="ll" type="button">English</button>
  </div>

  <div id="view" hidden></div>
  <footer data-t>🌸 عمارة 220 · حي القرنفل</footer>
</div>

<div id="mov" class="mov" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>

<script>
// ضع هنا رابط الـ Web App من Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbzVJd0ogGGgehVNkPVuZyJWbjZeX5MBpkNNziDPv-8HN4LTYCX5gZtcjEKVbggRmDIQ6g/exec";

// بيانات التواصل مع المنشئ (القايمة الجانبية). اتركهم فاضيين لإخفاء الزر.
// phone بصيغة دولية بدون + (مثال 201012345678)
const CREATOR = { name: 'حسام', phone: '', email: '' };

const $ = id => document.getElementById(id);
const nd = s => String(s).replace(/[٠-٩]/g, c => c.charCodeAt(0) - 1632).replace(/[۰-۹]/g, c => c.charCodeAt(0) - 1776).trim();

// ---------- اللغة والوضع ----------
const LKEY = 'bf_lang', TKEY = 'bf_theme';
let LANG = 'ar', THEME = 'auto';

async function compress(file, max, q) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q || 0.72).split(',')[1];
}

async function login(apt, pin, auto, tok) {
  $('err').textContent = '';
  $('go').disabled = true;
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'check', apt: apt, pin: pin || '', tok: tok || '', did: DID }) });
    const d = await r.json();
    if (!d.ok) {
      if (d.error === 'expired' || (auto && d.error === 'bad')) clear();
      $('err').textContent = d.error === 'locked'
        ? t('تم قفل الشقة مؤقتاً بسبب محاولات خاطئة. حاول بعد ساعة.')
        : d.error === 'expired' ? t('انتهت الجلسة، اكتب الرقم السري من جديد.')
        : t('رقم الشقة أو الرقم السري غير صحيح.');
      if (auto) showLogin();
    } else { save(apt, d.tok); CUR = { a: apt, t: d.tok }; render(d); markFresh(); }
  } catch (e) {
    $('err').textContent = t('تعذر الاتصال، حاول مرة أخرى.');
    if (auto) showLogin();
  }
  $('go').disabled = false;
}

// لون كارت الحالة يتدرج: أحمر ← برتقالي ← ذهبي ← أخضر مع نسبة السداد
function heroColors(p) {
  const st = [[0, 4, 72, 47], [40, 22, 85, 46], [70, 48, 80, 38], [100, 145, 62, 34]];
  let i = 0; while (i < st.length - 2 && p > st[i + 1][0]) i++;
  const a = st[i], b = st[i + 1], t = Math.max(0, Math.min(1, (p - a[0]) / (b[0] - a[0])));
  const m = k => a[k] + (b[k] - a[k]) * t;
  const h = Math.round(m(1)), s = Math.round(m(2)), l = Math.round(m(3));
  return 'linear-gradient(135deg,hsl(' + h + ',' + s + '%,' + l + '%),hsl(' + (h + 12) + ',' + s + '%,' + (l + 10) + '%))';
}

const ERR = { method: 'وسيلة الدفع غير صحيحة، حدّث الصفحة.', amount: 'المبلغ غير صحيح أو أكبر من المتبقي.', done: 'هذا البند مكتمل بالفعل.', file: 'الصورة غير مقبولة، جرّب صورة أخرى.', expired: 'انتهت الجلسة، حدّث الصفحة واكتب الرقم السري من جديد.' };

function askAmount(b) {
  const METHODS = ((DATA && DATA.settings && DATA.settings.methods) || []);
  const rest = Number(b.dataset.rest), desc = b.dataset.desc, code = b.dataset.code;
  const ov = document.createElement('div');
  ov.className = 'ov';
  const hint = LANG === 'en'
    ? 'Remaining ' + money(rest) + '. Enter the amount you transferred (it can be a partial amount).'
    : 'المتبقي ' + money(rest) + '. اكتب المبلغ الذي حوّلته (يمكن أن يكون جزءاً منه).';
  ov.innerHTML = '<div class="sheet"><h2>' + esc(desc) + '</h2>' +
    '<div class="mut">' + hint + '</div>' +
    '<div class="field"><label>' + t('المبلغ بالجنيه') + '</label><input id="amt" inputmode="decimal" autocomplete="off" value="' + rest + '"></div>' +
    (METHODS.length > 1 ? '<div class="field"><label>' + t('وسيلة الدفع') + '</label><select id="mth">' + METHODS.map(m => '<option>' + esc(m) + '</option>').join('') + '</select></div>' : '') +
    '<div id="aerr" class="err"></div>' +
    '<button class="btn" id="pick">' + t('📎 اختيار صورة الإيصال ورفعها') + '</button>' +
    '<button class="cancel" id="cx">' + t('إلغاء') + '</button></div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $('cx').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  $('pick').onclick = () => {
    const amt = Number(nd($('amt').value).replace(/[٫,]/g, '.'));
    if (!isFinite(amt) || amt <= 0 || amt > rest) {
      $('aerr').textContent = LANG === 'en' ? 'Enter an amount above zero and no more than ' + money(rest) + '.' : 'اكتب مبلغاً أكبر من صفر ولا يزيد عن ' + money(rest) + '.';
      return;
    }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      const method = $('mth') ? $('mth').value : (METHODS[0] || '');
      // تأكيد فوري: نقفل النافذة ونعرض البند «جاري رفع الإيصال» قبل ما السيرفر يرد، ولو فشل نرجّع الحالة السابقة
      const prev = JSON.parse(JSON.stringify(DATA));
      const it = (DATA.items || []).find(x => String(x.code) === String(code));
      if (it) { it.pending = true; it.pendingAmount = amt; it.uploading = true; }
      UPLOADING = true; close(); render(DATA, true);
      let msg = t('تعذر الرفع، حاول مرة أخرى.');
      try {
        const data = await compress(f);
        const r = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'upload', apt: CUR.a, tok: CUR.t, did: DID, code: code, amount: amt, method: method, mime: 'image/jpeg', data })
        });
        const x = await r.json();
        if (x.ok) {
          // رسالة واتساب لأمين الصندوق تفضل بالعربي دايماً
          LAST = { code: code, msg: 'شقة ' + CUR.a + ': ساهمت بمبلغ ' + amt + ' جنيه في بند \"' + desc + '\". رفعت الإيصال في الموقع.' };
          if (it) it.uploading = false;
          UPLOADING = false; render(DATA, true); toast(t('تم رفع الإيصال ✓'));
          silentRefresh(true);
          return;
        }
        if (ERR[x.error]) msg = t(ERR[x.error]);
      } catch (e) {}
      UPLOADING = false; render(prev, true); toast(msg);
    };
    inp.click();
  };
}

function tickerHtml(items) {
  if (!items.length) return '';
  const rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const one = a => typeof a === 'string' ? esc(a) : '<span class="tb">' + esc(a.k) + '</span>' + esc(a.t) + vwLink(a.id, a.img);

  const set = '<span class="ts">' + items.map(a => '<span class="tx">' + one(a).replace(/\s*\n\s*/g, ' ') + '</span><span class="sep">✦</span>').join('') + '</span>';
  return '<div class="tick" id="tick" data-n="' + items.length + '"><span class="ti">📢</span><div class="tv"><div class="tt" id="tt">' + set + '</div></div></div>';
}
function startTicker() {
  const tick = $('tick'); if (!tick || tick.dataset.on) return;
  const tt = $('tt'), tv = tt.parentNode, one = tt.firstChild;
  const w = one.getBoundingClientRect().width;
  tick.dataset.on = '1';
  if (tick.dataset.n === '1' && w - 40 <= tv.clientWidth) { tick.classList.add('still'); const sp = one.querySelector('.sep'); if (sp) sp.remove(); return; }
  tt.appendChild(one.cloneNode(true));
  tt.style.setProperty('--d', Math.max(14, Math.round(w / 55)) + 's');
}

// ---------- إشعارات داخل الصفحة (بدون سيرفر): تأكيد/رفض الإيصال، إعلانات جديدة، حالة إعلاناتي ----------
// نقارن آخر بيانات وصلت بآخر حالة اتشافت على الجهاز، وأي فرق يتحول لكارت إشعار في أول الصفحة لحد ما الساكن يقفله.
const NKEY = a => 'bf_nt_' + a, SKEY = a => 'bf_seen_' + a;
function nLoad() {
  try { const l = JSON.parse(localStorage.getItem(NKEY(CUR.a)) || '[]'); return l.filter(n => Date.now() - n.ts < 14 * 86400000); } catch (e) { return []; }
}
function nSave(l) { try { localStorage.setItem(NKEY(CUR.a), JSON.stringify(l.slice(0, 10))); } catch (e) {} }
function detectNotes(d) {
  if (!CUR || !d || d.ok !== true) return;
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(SKEY(CUR.a)) || 'null'); } catch (e) {}
  const csig = c => c.date + '|' + c.desc + '|' + c.amount;
  const cur = { cl: {}, ads: (d.ads || []).map(a => String(a.id)), my: {} };
  (d.claims || []).forEach(c => { cur.cl[csig(c)] = c.status; });
  (d.myAds || []).forEach(a => { cur.my[a.id] = a.status; });
  if (seen && seen.cl && seen.ads && seen.my) {
    const list = nLoad(), have = {}; list.forEach(n => { have[n.k] = 1; });
    const add = n => { if (!have[n.k]) { have[n.k] = 1; n.ts = Date.now(); list.unshift(n); } };
    (d.claims || []).forEach(c => {
      if ((c.status !== 'confirmed' && c.status !== 'rejected') || seen.cl[csig(c)] === c.status) return;
      add({ k: 'c_' + csig(c) + '_' + c.status, ty: c.status === 'confirmed' ? 'cok' : 'crej', a: c.amount, d: c.desc, n: c.note || '' });
    });
    const newAds = (d.ads || []).filter(a => a.apt !== CUR.a && seen.ads.indexOf(String(a.id)) < 0);
    if (newAds.length) add({ k: 'a_' + newAds.map(a => a.id).join(','), ty: 'ads', a: newAds.length, d: String(newAds[0].text || '').slice(0, 70), n: '' });
    (d.myAds || []).forEach(a => {
      const was = seen.my[a.id];
      if (!was || was === a.status || (a.status !== 'published' && a.status !== 'rejected')) return;
      add({ k: 'm_' + a.id + '_' + a.status, ty: a.status === 'published' ? 'myok' : 'myrej', a: 0, d: String(a.text || '').slice(0, 70), n: a.note || '' });
    });
    nSave(list);
  }
  try { localStorage.setItem(SKEY(CUR.a), JSON.stringify(cur)); } catch (e) {}
}
function noteText(n) {
  const en = LANG === 'en', dd = esc(n.d || '');
  if (n.ty === 'cok') return { i: '✅', c: 'ok', x: en ? 'Your receipt of ' + money(n.a) + ' was confirmed' : 'تم تأكيد إيصالك بمبلغ ' + money(n.a), s: dd, go: '' };
  if (n.ty === 'crej') return { i: '❌', c: 'bad', x: en ? 'Your receipt of ' + money(n.a) + ' was rejected' : 'تم رفض إيصالك بمبلغ ' + money(n.a), s: dd + (n.n ? ' · ' + esc(n.n) : ''), go: '' };
  if (n.ty === 'ads') return { i: '🏪', c: '', x: en ? (n.a > 1 ? n.a + ' new listings in the building market' : 'New listing in the building market') : (n.a > 1 ? n.a + ' إعلانات جديدة في سوق العمارة' : 'إعلان جديد في سوق العمارة'), s: n.a > 1 ? '' : dd, go: 'market' };
  if (n.ty === 'myok') return { i: '📣', c: 'ok', x: en ? 'Your listing was published' : 'تم نشر إعلانك', s: dd, go: 'mine' };
  return { i: '📣', c: 'bad', x: en ? 'Your listing was rejected' : 'تم رفض إعلانك', s: dd + (n.n ? ' · ' + esc(n.n) : ''), go: 'mine' };
}
function notesHtml() {
  if (!CUR) return '';
  const l = nLoad();

        h += '<a class="paid-btn" target="_blank" rel="noopener" href="' + waLink(s.treasurer_phone, LAST.msg) + '">' + t('📲 أبلغ أمين الصندوق على واتساب') + '</a>';
    } else if (!ok && s.treasurer_phone) {
      if (i.rejected) h += '<div class="rejnote">' + t('❌ تم رفض الإيصال السابق') + (i.rejectNote ? ': ' + esc(i.rejectNote) : '') + '. ' + t('يمكنك رفع إيصال جديد.') + '</div>';
      h += '<button class="paid-btn" data-code="' + esc(i.code) + '" data-desc="' + esc(i.desc) + '" data-rest="' + i.remaining + '">' + t('✅ ساهمت (ارفع الإيصال)') + '</button>';
    }
    h += '</div>';
  });
  h += '</div>';

  const pm = s.pay || [];
  if (pm.length || s.pay_info || s.treasurer_phone) {
    h += '<div class="card"><h2>' + t('طريقة المساهمة') + '</h2>';
    if (s.treasurer_name) h += '<div class="mut" style="margin-bottom:10px">' + t('أمين الصندوق') + ': ' + esc(s.treasurer_name) + '</div>';
    pm.forEach((p, n) => {
      h += '<div class="pm"><div class="ty">' + esc(p.type || t('وسيلة دفع')) + '</div><div class="nu">' + esc(p.number) + '</div>' +
           '<button class="copy" data-copy="' + n + '">' + t('نسخ الرقم') + '</button></div>';
    });
    if (s.pay_info) h += '<div class="payinfo">' + esc(s.pay_info) + '</div>';
    h += '</div>';
  }

  if (d.done && d.done.length) {
    const drow = x => '<div class="item"><div class="top"><span class="name">' + esc(x.desc) + '</span><span class="chip ok">' + t('تم الدفع ✓') + '</span></div>' +
      '<div class="meta">' + t('الإسهام') + ' ' + money(x.amount) + ' · ' + t('تاريخ الدفع') + ' ' + esc(x.paidOn || '-') + ' · ' + t('الموعد') + ' ' + esc(x.due) + wk(x.work) + '</div><div class="pb"><i style="width:100%"></i></div></div>';
    h += '<div class="card"><h2>' + t('المشاريع المدفوعة') + '</h2>' + d.done.slice(0, 3).map(drow).join('');
    if (d.done.length > 3) h += '<div id="moreDone" hidden>' + d.done.slice(3).map(drow).join('') + '</div><button class="copy" id="showDone">' + t('عرض الكل') + ' (' + d.done.length + ')</button>';
    h += '</div>';
  }

  if (d.claims && d.claims.length) {
    const CS = { pending: [t('قيد المراجعة ⏳'), 'wait'], confirmed: [t('تم التأكيد ✓'), 'ok'], rejected: [t('مرفوض'), 'rej'] };
    const crow = c => '<div class="prow"><div><div class="pn">' + esc(c.desc) + '</div><div class="mut">' + esc(c.date) + ' · ' + money(c.amount) + '</div>' +
      (c.method ? '<div class="mut">' + esc(c.method) + '</div>' : '') + (c.note ? '<div class="mut" style="color:var(--bad);white-space:pre-line">' + esc(c.note) + '</div>' : '') +
      '</div><span class="chip ' + CS[c.status][1] + '">' + CS[c.status][0] + '</span></div>';
    h += '<div class="card"><h2>' + t('إيصالاتك') + '</h2>' + d.claims.slice(0, 5).map(crow).join('');
    if (d.claims.length > 5) h += '<div id="moreCl" hidden>' + d.claims.slice(5).map(crow).join('') + '</div><button class="copy" id="showCl">' + t('عرض الكل') + ' (' + d.claims.length + ')</button>';
    h += '</div>';
  }

  const cReg = (d.contribs || []).filter(x => !x.adv), cAdv = (d.contribs || []).filter(x => x.adv);
  if (cReg.length || cAdv.length) {
    const row = p => '<div class="prow"><div><div class="pn">' + esc(p.desc) + '</div><div class="mut">' + esc(p.date) + '</div></div><b class="pa">' + money(p.amount) + ' ✓</b></div>';
    h += '<div class="card"><h2>' + t('مساهماتك') + '</h2>' + cReg.slice(0, 5).map(row).join('');
    if (cReg.length > 5) h += '<div id="morePays" hidden>' + cReg.slice(5).map(row).join('') + '</div><button class="copy" id="showAll">' + t('عرض كل الدفعات') + ' (' + cReg.length + ')</button>';
    h += cAdv.map(a => '<div class="item"><div class="top"><span class="name">' + esc(a.desc) + '</span><span class="chip ok">' + t('مدفوع مقدماً ✓') + ' ' + money(a.amount) + '</span></div></div>').join('');
    h += '</div>';
  }

  if (d.expenses && d.expenses.length) {
    const erow = e => '<div class="prow"><div><div class="pn">' + esc(e.desc) + '</div><div class="mut">' + esc(e.date) + '</div>' +
      (e.details ? '<div class="mut" style="white-space:pre-line;margin-top:2px">' + esc(e.details) + '</div>' : '') +
      '</div><b>' + money(e.amount) + '</b></div>';
    const gs = [], gi = {};
    d.expenses.forEach(e => { const k = e.proj ? 'p:' + e.proj : 'g'; if (!(k in gi)) { gi[k] = gs.length; gs.push({ title: e.proj ? e.pdesc : t('مصروفات الصيانة'), sub: e.proj ? t('مصروفات المشروع') : '', rows: [] }); } gs[gi[k]].rows.push(e); });
    gs.forEach((g, n) => {
      const tot = g.rows.reduce((x, e) => x + e.amount, 0);
      h += '<div class="card"><h2>' + esc(g.title) + '</h2>' + (g.sub ? '<div class="mut">' + g.sub + ' · ' + t('الإجمالي') + ' ' + money(tot) + '</div>' : '') + g.rows.slice(0, 5).map(erow).join('');
      if (g.rows.length > 5) h += '<div id="moreExp' + n + '" hidden>' + g.rows.slice(5).map(erow).join('') + '</div><button class="copy" data-more="moreExp' + n + '">' + t('عرض كل المصروفات') + ' (' + g.rows.length + ')</button>';
      h += '</div>';
    });
  }

  (d.pcards || []).forEach(p => {
    h += '<div class="card"><h2>' + esc(p.desc) + '</h2>';
    if (p.required !== null) {
      const pc = p.required ? Math.min(100, Math.round(p.collected / p.required * 100)) : 0;
      h += '<div class="mut">' + collected(p.collected, p.required, pc) + wk(p.work) + '</div>' + (p.total ? '<div class="mut" style="margin-top:4px">' + contrib(p.count, Math.min(100, Math.round(p.count / p.total * 100))) + '</div>' : '') + '<div class="pb" style="margin-top:10px"><i style="width:' + pc + '%"></i></div>';
    } else if (p.work) h += '<div class="mut">' + t('التنفيذ') + ': ' + (p.work === 'done' ? t('تم ✓') : t('جاري')) + '</div>';
    if (p.balance !== null) h += '<div class="top" style="margin-top:10px"><span class="mut">' + (p.final ? t('فائض') : t('رصيد المشروع الان')) + '</span><span class="chip ' + (p.final ? 'ok' : 'wait') + '">' + money(p.balance) + '</span></div>';
    h += '</div>';
  });

  if (d.fund !== null && d.fund !== undefined) {
    const fp = d.fundPart && d.fundPart.total ? Math.min(100, Math.round(d.fundPart.count / d.fundPart.total * 100)) : null;
    h += '<div class="card fund"><div class="ic">🛠️</div><div style="flex:1"><span class="mut">' + t('رصيد صندوق الصيانة') + '</span><b>' + money(d.fund) + '</b>' +
      (fp !== null ? '<div class="mut" style="margin-top:8px">' + esc(d.fundPart.desc) + ': ' + contrib(d.fundPart.count, fp) + '</div><div class="pb" style="margin-top:6px"><i style="width:' + fp + '%"></i></div>' : '') + '</div></div>';
  }

  $('view').innerHTML = h;
  bindNotes();
  $('login').hidden = true;
  $('view').hidden = false;
  $('mbtn').hidden = false;
  buildMenu();
  startTicker();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const k = $('tick'); if (k && !k.classList.contains('still') && k.dataset.n === '1') { /* خط جديد اتحمّل: نعيد القياس */ k.removeAttribute('data-on'); const tt = $('tt'); while (tt.children.length > 1) tt.lastChild.remove(); tt.style.removeProperty('--d'); startTicker(); } });
  if (!keepScroll) window.scrollTo(0, 0);

  document.querySelectorAll('.paid-btn[data-code]').forEach(b => b.onclick = () => askAmount(b));
  document.querySelectorAll('button[data-more]').forEach(b => b.onclick = () => { $(b.dataset.more).hidden = false; b.hidden = true; });
  const sd = $('showDone');
  if (sd) sd.onclick = () => { $('moreDone').hidden = false; sd.hidden = true; };
  const sc = $('showCl');
  if (sc) sc.onclick = () => { $('moreCl').hidden = false; sc.hidden = true; };
  const sa = $('showAll');
  if (sa) sa.onclick = () => { $('morePays').hidden = false; sa.hidden = true; };
  document.querySelectorAll('[data-copy]').forEach(c => c.onclick = async () => {
    const tx = (s.pay || [])[Number(c.dataset.copy)].number;
    try { await navigator.clipboard.writeText(tx); }
    catch (e) {
      const x = document.createElement('textarea'); x.value = tx; document.body.appendChild(x);
      x.select(); document.execCommand('copy'); x.remove();
    }
    c.textContent = t('تم النسخ ✓'); setTimeout(() => c.textContent = t('نسخ الرقم'), 1800);
  });
}

// ---------- شريط الاتصال: يظهر لما النت يفصل، مع وقت آخر تحديث ----------
let LASTOK = 0, NETFAIL = false;
try { LASTOK = Number(localStorage.getItem('bf_cts')) || 0; } catch (e) {}
function agoTxt(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return t('الآن');
  const h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (LANG === 'en') return (d ? d + ' d' : h ? h + ' h' : m + ' min') + ' ago';
  return 'منذ ' + (d ? d + (d === 1 ? ' يوم' : ' أيام') : h ? h + (h === 1 ? ' ساعة' : h === 2 ? ' ساعتين' : ' ساعات') : m + (m === 1 ? ' دقيقة' : m === 2 ? ' دقيقتين' : m <= 10 ? ' دقائق' : ' دقيقة'));
}
function netBar() {
  const el = $('netbar'); if (!el) return;
  const off = !navigator.onLine || NETFAIL;
  if (!off || !CUR) { el.hidden = true; return; }
  el.textContent = '⚠️ ' + t('بدون اتصال') + (LASTOK ? ' · ' + t('آخر تحديث') + ' ' + agoTxt(Date.now() - LASTOK) : '');
  el.hidden = false;
}
function markFresh() {
  LASTOK = Date.now(); NETFAIL = false;
  try { localStorage.setItem('bf_cts', String(LASTOK)); } catch (e) {}
  netBar();
}
window.addEventListener('offline', netBar);
window.addEventListener('online', () => { netBar(); silentRefresh(); });
setInterval(netBar, 30000);
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

// تحديث تلقائي صامت: كل دقيقة، وفور الرجوع للصفحة. لا يمس الشاشة إلا لو البيانات اتغيّرت فعلاً.
let RF_BUSY = false;
function rfBlocked() {
  const a = document.activeElement;
  return !CUR || RF_BUSY || UPLOADING || document.hidden || document.querySelector('.ov') || (a && /TEXTAREA|INPUT|SELECT/.test(a.tagName));
}
let RF_AGAIN = false;
async function silentRefresh(force) {
  if (force === true) { if (!CUR) return; if (RF_BUSY) { RF_AGAIN = true; return; } }
  else if (rfBlocked()) return;
  RF_BUSY = true;
  const who = CUR.a + '|' + CUR.t;
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'check', apt: CUR.a, pin: '', tok: CUR.t, did: DID }) });
    const d = await r.json();
    // نتجاهل أي فشل أو رد متأخر، ولا نعمل تحديث لو المستخدم بدأ يكتب أو فتح نافذة أثناء الانتظار
    if (d && !d.ok && (d.error === 'expired' || d.error === 'bad') && CUR && who === CUR.a + '|' + CUR.t) {
      clear(); showLogin();
      $('err').textContent = t('انتهت الجلسة، اكتب الرقم السري من جديد.');
    } else if (d && d.ok && CUR && who === CUR.a + '|' + CUR.t) {
      if (d.tok) { CUR.t = d.tok; save(CUR.a, d.tok); }
      markFresh();
      // الرمز يتغير مع كل طلب، فنقارن البيانات بدونه
      const strip = x => JSON.stringify(Object.assign({}, x, { tok: 0 }));
      if ((force === true ? !UPLOADING : !rfBlocked_afterFetch()) && strip(d) !== strip(DATA)) render(d, true);
    }
  } catch (e) { NETFAIL = true; netBar(); }
  RF_BUSY = false;
  if (RF_AGAIN) { RF_AGAIN = false; silentRefresh(true); }
}
function rfBlocked_afterFetch() {
  const a = document.activeElement;
  return UPLOADING || document.hidden || document.querySelector('.ov') || (a && /TEXTAREA|INPUT|SELECT/.test(a.tagName));
}
setInterval(silentRefresh, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) silentRefresh(); });

applyTheme();
applyStatic();
$('go').onclick = () => login(nd($('apt').value), nd($('pin').value));
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const q = new URLSearchParams(location.search);
if (q.get('apt') && q.get('pin')) {
  const qa = q.get('apt'), qp = q.get('pin');
  try { history.replaceState(null, '', location.pathname); } catch (e) {} // لا يبقى الرقم السري في شريط العنوان/السجل
  login(qa, qp);
} else {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.a && s.t) {
      const c = cacheLoad(s.a);
      $('login').hidden = true; $('view').hidden = false;
      if (c) { CUR = { a: s.a, t: s.t }; render(c); netBar(); silentRefresh(); }
      else { $('view').innerHTML = '<div class="card"><div class="mut" style="text-align:center">' + t('جاري التحميل...') + '</div></div>'; login(s.a, '', true, s.t); }
    }
    else if (s && s.a && s.p) login(s.a, s.p, true); // تخزين قديم: يدخل مرة ثم يُستبدل برمز جلسة بلا الرقم السري
  } catch (e) {}
}
</script>
</body>
</html>
