<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16294d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>عمارة 220 - حي القرنفل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f8;--card:#ffffff;--tx:#1a1f33;--mut:#6e7388;--br:#ece8ef;
  --ac:#243f7b;--ac2:#3d63b8;--rose:#d6457a;--rose2:#ff8db0;--ok:#12a150;--okbg:#e6f6ed;--bad:#d93a3a;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff5e0;
  --sh:0 8px 28px rgba(22,41,77,.09);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1220;--card:#171d30;--tx:#eef1fa;--mut:#9aa3ba;--br:#262e47;
  --ac:#7da2ff;--ac2:#a3bcff;--rose:#ff7aa8;--rose2:#ffb3cb;--ok:#4cd08a;--okbg:#12301f;--bad:#ff7b7b;--badbg:#341a1d;--warn:#f1c05a;--warnbg:#352a12;
  --sh:0 6px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;
  padding:0 0 max(24px,env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* brand header */
.brand{position:relative;overflow:hidden;text-align:center;color:#fff;
  padding:calc(max(18px,env(safe-area-inset-top)) + 8px) 20px 62px;border-radius:0 0 34px 34px;
  background:linear-gradient(160deg,#122548 0%,#1f3a72 55%,#33559b 100%);box-shadow:0 10px 30px rgba(22,41,77,.25)}
.brand::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:
   radial-gradient(circle at 12% 30%,rgba(255,141,176,.35) 0 5px,transparent 6px),
   radial-gradient(circle at 88% 22%,rgba(255,141,176,.28) 0 8px,transparent 9px),
   radial-gradient(circle at 78% 78%,rgba(255,255,255,.14) 0 4px,transparent 5px),
   radial-gradient(circle at 20% 82%,rgba(255,255,255,.12) 0 6px,transparent 7px),
   radial-gradient(120% 90% at 100% 0%,rgba(255,141,176,.18),transparent 60%)}
.brand>*{position:relative}
.emb{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,179,203,.55);box-shadow:0 0 0 7px rgba(255,255,255,.06)}
.brand h1{margin:0;font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:700;font-size:30px;line-height:1.35}
.brand .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;color:var(--rose2);font-family:'Noto Kufi Arabic','Tajawal',sans-serif;font-weight:600;font-size:15px}
.brand .sub i{display:block;width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--rose2))}
.brand .sub i:last-child{background:linear-gradient(270deg,transparent,var(--rose2))}
footer{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--br);animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.mut{color:var(--mut);font-size:13px}

/* login */
.login{margin-top:-34px;position:relative;text-align:center}
.login h2{margin:0 0 4px;font-size:20px}
h2::before{content:"";display:inline-block;width:4px;height:16px;border-radius:4px;background:var(--rose);margin-inline-end:8px;vertical-align:-2px}
.field{text-align:right;margin-top:14px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:14px;font-size:18px;font-family:inherit;border:1.5px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);outline:none;text-align:center;letter-spacing:2px}
input:focus{border-color:var(--ac)}
.btn{width:100%;margin-top:18px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(36,63,123,.30)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);margin-top:12px;font-size:14px;min-height:20px}

/* hero */
.hero{position:relative;border-radius:24px;padding:22px 18px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:var(--sh);animation:up .45s ease both}
.hero.ok{background:linear-gradient(135deg,#0f9d58,#34c77b)}
.hero.bad{background:linear-gradient(135deg,#d93a3a,#ff7a59)}
.hero .apt{font-size:14px;opacity:.9}
.hero .big{font-size:30px;font-weight:800;margin:6px 0 2px}
.hero .sub{font-size:14px;opacity:.95}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:16px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .9s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:16px}.stat span{font-size:12px;opacity:.9}

/* announcement */
.qt{background:var(--card);border:1px solid var(--br);border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--sh);text-align:center}
.qt .q{font-size:18px;line-height:2;font-weight:600}
.qt .qs{margin-top:8px;font-size:13px;color:var(--mut)}
.note{background:var(--warnbg);color:var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;font-weight:500;display:flex;gap:10px;align-items:flex-start;white-space:pre-line}

/* items */
.item{padding:14px 0;border-bottom:1px solid var(--br)}
.item:last-child{border-bottom:0;padding-bottom:0}.item:first-of-type{padding-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:16px}
.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.late{background:var(--bad);color:#fff}.chip.wait{background:var(--warnbg);color:var(--warn)}
.meta{font-size:13px;color:var(--mut);margin:6px 0 8px}
.pb{height:7px;border-radius:99px;background:var(--br);overflow:hidden}
.pb>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.paid-btn{margin-top:10px;display:inline-flex;gap:6px;align-items:center;font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;
  background:var(--okbg);color:var(--ok);border:0;text-decoration:none;cursor:pointer}

/* rows */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.prow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.pn{font-weight:700;font-size:15px}.pa{color:var(--ok);font-weight:700;font-size:15px}
.payinfo{white-space:pre-line;background:var(--bg);border-radius:14px;padding:12px;font-size:15px;line-height:1.7}
.copy{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--ac);background:transparent;color:var(--ac);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.pm{border:1.5px solid var(--br);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.pm .ty{font-size:13px;color:var(--mut);font-weight:700}
.pm .nu{font-size:22px;font-weight:800;letter-spacing:1px;direction:ltr;text-align:right;margin:4px 0 0;word-break:break-all;user-select:all}
.pm .copy{margin-top:8px;padding:10px}
.fund{display:flex;align-items:center;gap:12px}
.fund .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--okbg);font-size:22px}
.fund b{font-size:20px;display:block}
.out{display:block;margin:6px auto 0;background:none;border:0;color:var(--mut);font-family:inherit;font-size:14px;cursor:pointer;padding:10px}
#view>.hero:first-child{margin-top:-34px}
/* amount modal */
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);animation:up .25s ease both}
.sheet h2{margin-bottom:6px}
.sheet .btn{margin-top:14px}
.sheet .cancel{display:block;width:100%;margin-top:6px;background:none;border:0;color:var(--mut);font-family:inherit;font-size:15px;padding:10px;cursor:pointer}
.chip.rej{background:var(--badbg);color:var(--bad)}
.rejnote{margin-top:8px;background:var(--badbg);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:14px;white-space:pre-line}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="brand">
  <div class="emb"><svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <defs>
          <g id="pt"><path d="M0,-4 C-9,-8 -11,-19 -6,-24 C-4,-21 -2,-22 0,-25 C2,-22 4,-21 6,-24 C11,-19 9,-8 0,-4Z"/></g>
        </defs>
        <path d="M32 40 C32 49 31 55 30 61" stroke="#7fd1a0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M31 52 C24 50 20 46 19 41 C25 41 29 45 31 52Z" fill="#7fd1a0"/>
        <g transform="translate(32 27)">
          <g fill="#ff8db0"><use href="#pt"/><use href="#pt" transform="rotate(45)"/><use href="#pt" transform="rotate(90)"/><use href="#pt" transform="rotate(135)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(225)"/><use href="#pt" transform="rotate(270)"/><use href="#pt" transform="rotate(315)"/></g>
          <g fill="#ffb3cb" transform="scale(.72)"><use href="#pt" transform="rotate(22)"/><use href="#pt" transform="rotate(67)"/><use href="#pt" transform="rotate(112)"/><use href="#pt" transform="rotate(157)"/><use href="#pt" transform="rotate(202)"/><use href="#pt" transform="rotate(247)"/><use href="#pt" transform="rotate(292)"/><use href="#pt" transform="rotate(337)"/></g>
          <circle r="4.2" fill="#ffd9e5"/>
        </g>
      </svg></div>
  <h1>عمارة 220</h1>
  <div class="sub"><i></i>حي القرنفل<i></i></div>
</header>
<div class="wrap">

  <div id="login" class="card login">
    <h2>تسجيل الدخول</h2>
    <div class="mut">ادخل بيانات شقتك لمتابعة مساهماتك</div>
    <div class="field"><label>رقم الشقة</label><input id="apt" inputmode="numeric" autocomplete="off"></div>
    <div class="field"><label>الرقم السري</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <button id="go" class="btn">دخول</button>
    <div id="err" class="err"></div>
  </div>

  <div id="view" hidden></div>
  <footer>🌸 عمارة 220 · حي القرنفل</footer>
</div>

<script>
// ضع هنا رابط الـ Web App من Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbzVJd0ogGGgehVNkPVuZyJWbjZeX5MBpkNNziDPv-8HN4LTYCX5gZtcjEKVbggRmDIQ6g/exec";

const $ = id => document.getElementById(id);
const nd = s => String(s).replace(/[٠-٩]/g, c => c.charCodeAt(0) - 1632).replace(/[۰-۹]/g, c => c.charCodeAt(0) - 1776).trim();
const money = n => Number(n).toLocaleString('en-US') + ' جنيه';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'bf_login';
const save = (a, p) => { try { localStorage.setItem(KEY, JSON.stringify({ a, p })); } catch (e) {} };
const clear = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
let DATA = null, CUR = null, LAST = null;
let DID = '';
try {
  DID = localStorage.getItem('bf_did') || '';
  if (!DID) { DID = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).slice(0, 8); localStorage.setItem('bf_did', DID); }
} catch (e) { DID = 'nostore'; }

async function compress(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const sc = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72).split(',')[1];
}

async function login(apt, pin, auto) {
  $('err').textContent = '';
  $('go').disabled = true;
  try {
    const r = await fetch(API_URL + '?apt=' + encodeURIComponent(apt) + '&pin=' + encodeURIComponent(pin) + '&did=' + encodeURIComponent(DID));
    const d = await r.json();
    if (!d.ok) {
      if (auto && d.error === 'bad') clear();
      $('err').textContent = d.error === 'locked'
        ? 'تم قفل الشقة مؤقتاً بسبب محاولات خاطئة. حاول بعد ساعة.'
        : 'رقم الشقة أو الرقم السري غير صحيح.';
    } else { save(apt, pin); CUR = { a: apt, p: pin }; render(d); }
  } catch (e) {
    $('err').textContent = 'تعذر الاتصال، حاول مرة أخرى.';
  }
  $('go').disabled = false;
}

function waLink(phone, text) {
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
}

// لون كارت الحالة يتدرج: أحمر ← برتقالي ← ذهبي ← أخضر مع نسبة السداد
function heroColors(p) {
  const st = [[0, 4, 72, 47], [40, 22, 85, 46], [70, 48, 80, 38], [100, 145, 62, 34]];
  let i = 0; while (i < st.length - 2 && p > st[i + 1][0]) i++;
  const a = st[i], b = st[i + 1], t = Math.max(0, Math.min(1, (p - a[0]) / (b[0] - a[0])));
  const m = k => a[k] + (b[k] - a[k]) * t;
  const h = Math.round(m(1)), s = Math.round(m(2)), l = Math.round(m(3));
  return 'linear-gradient(135deg,hsl(' + h + ',' + s + '%,' + l + '%),hsl(' + (h + 12) + ',' + s + '%,' + (l + 10) + '%))';
}

const ERR = { amount: 'المبلغ غير صحيح أو أكبر من المتبقي.', done: 'هذا البند مكتمل بالفعل.', file: 'الصورة غير مقبولة، جرّب صورة أخرى.' };

function askAmount(b) {
  const rest = Number(b.dataset.rest), desc = b.dataset.desc, code = b.dataset.code;
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = '<div class="sheet"><h2>' + esc(desc) + '</h2>' +
    '<div class="mut">المتبقي ' + money(rest) + '. اكتب المبلغ الذي حوّلته (يمكن أن يكون جزءاً منه).</div>' +
    '<div class="field"><label>المبلغ بالجنيه</label><input id="amt" inputmode="decimal" autocomplete="off" value="' + rest + '"></div>' +
    '<div id="aerr" class="err"></div>' +
    '<button class="btn" id="pick">📎 اختيار صورة الإيصال ورفعها</button>' +
    '<button class="cancel" id="cx">إلغاء</button></div>';
  document.body.appendChild(ov);
  const close = () => ov.remove();
  $('cx').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
  $('pick').onclick = () => {
    const amt = Number(nd($('amt').value).replace(/[٫,]/g, '.'));
    if (!isFinite(amt) || amt <= 0 || amt > rest) { $('aerr').textContent = 'اكتب مبلغاً أكبر من صفر ولا يزيد عن ' + money(rest) + '.'; return; }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      $('pick').disabled = true; $('pick').textContent = 'جاري رفع الإيصال...'; $('aerr').textContent = '';
      let msg = 'تعذر الرفع، حاول مرة أخرى.';
      try {
        const data = await compress(f);
        const r = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'upload', apt: CUR.a, pin: CUR.p, did: DID, code: code, amount: amt, mime: 'image/jpeg', data })
        });
        const x = await r.json();
        if (x.ok) {
          LAST = { code: code, msg: 'شقة ' + CUR.a + ': ساهمت بمبلغ ' + amt + ' جنيه في بند "' + desc + '". رفعت الإيصال في الموقع.' };
          close(); login(CUR.a, CUR.p); return;
        }
        if (ERR[x.error]) msg = ERR[x.error];
      } catch (e) {}
      $('aerr').textContent = msg;
      $('pick').disabled = false; $('pick').textContent = '📎 اختيار صورة الإيصال ورفعها';
    };
    inp.click();
  };
}

function render(d) {
  DATA = d;
  const s = d.settings || {};
  const paidAll = d.remaining <= 0;
  const pct = d.required > 0 ? Math.min(100, Math.round(d.paid / d.required * 100)) : 100;
  const today = new Date().toISOString().slice(0, 10);
  let h = '';

  h += '<div class="hero ' + (paidAll ? 'ok' : 'bad') + '" style="background:' + heroColors(pct) + '">' +
       '<div class="apt">شقة ' + esc(d.apt) + '</div>' +
       '<div class="big">' + (paidAll ? 'اكتمل إسهامك ✓' : money(d.remaining)) + '</div>' +
       '<div class="sub">' + (paidAll ? 'شكراً لمساهمتك في عمارتنا' : 'إسهامك المتبقي') + '</div>' +
       '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
       (paidAll ? '' : '<div class="stats">' +
         '<div class="stat"><b>' + money(d.required) + '</b><span>الإسهام المقرر</span></div>' +
         '<div class="stat"><b>' + money(d.paid) + '</b><span>ما أسهمت به</span></div>' +
         '<div class="stat"><b>' + pct + '%</b><span>نسبة الإنجاز</span></div>' +
       '</div>') + '</div>';

  if (d.quote) h += '<div class="qt"><div class="q">' + (d.quote.v ? '﴿' + esc(d.quote.t) + '﴾' : esc(d.quote.t)) + '</div><div class="qs">' + esc(d.quote.s) + '</div></div>';

  if (s.announcement) h += '<div class="note"><span>📢</span><span>' + esc(s.announcement) + '</span></div>';

  h += '<div class="card"><h2>المطلوب حالياً</h2>';
  if (!d.items.length) h += '<div class="mut">لا يوجد إسهام مطلوب حالياً ✓</div>';
  d.items.forEach(i => {
    const ok = i.remaining <= 0;
    const late = !ok && i.due && i.due < today;
    const p = i.amount > 0 ? Math.min(100, Math.round(i.paid / i.amount * 100)) : 100;
    h += '<div class="item"><div class="top"><span class="name">' + esc(i.desc) + '</span>' +
         '<span class="chip ' + (ok ? 'ok' : (i.pending ? 'wait' : (late ? 'late' : 'bad'))) + '">' +
         (ok ? 'مكتمل ✓' : (i.pending ? 'في انتظار التأكيد ⏳' : (late ? 'تأخر · ' : '') + money(i.remaining))) + '</span></div>' +
         '<div class="meta">الموعد ' + esc(i.due) + ' · الإسهام ' + money(i.amount) + ' · ما أسهمت به ' + money(i.paid) + '</div>' +
         '<div class="pb"><i style="width:' + p + '%"></i></div>';
    if (!ok && i.pending) {
      h += '<div class="mut" style="margin-top:8px">تم رفع إيصال بمبلغ ' + money(i.pendingAmount) + '، بانتظار تأكيد أمين الصندوق.</div>';
      if (LAST && LAST.code === String(i.code) && s.treasurer_phone)
        h += '<a class="paid-btn" target="_blank" rel="noopener" href="' + waLink(s.treasurer_phone, LAST.msg) + '">📲 أبلغ أمين الصندوق على واتساب</a>';
    } else if (!ok && s.treasurer_phone) {
      if (i.rejected) h += '<div class="rejnote">❌ تم رفض الإيصال السابق' + (i.rejectNote ? ': ' + esc(i.rejectNote) : '') + '. يمكنك رفع إيصال جديد.</div>';
      h += '<button class="paid-btn" data-code="' + esc(i.code) + '" data-desc="' + esc(i.desc) + '" data-rest="' + i.remaining + '">✅ ساهمت (ارفع الإيصال)</button>';
    }
    h += '</div>';
  });
  h += '</div>';

  const pm = s.pay || [];
  if (pm.length || s.pay_info || s.treasurer_phone) {
    h += '<div class="card"><h2>طريقة المساهمة</h2>';
    if (s.treasurer_name) h += '<div class="mut" style="margin-bottom:10px">أمين الصندوق: ' + esc(s.treasurer_name) + '</div>';
    pm.forEach((p, n) => {
      h += '<div class="pm"><div class="ty">' + esc(p.type || 'وسيلة دفع') + '</div><div class="nu">' + esc(p.number) + '</div>' +
           '<button class="copy" data-copy="' + n + '">نسخ الرقم</button></div>';
    });
    if (s.pay_info) h += '<div class="payinfo">' + esc(s.pay_info) + '</div>';
    h += '</div>';
  }

  if (d.done && d.done.length) {
    const drow = x => '<div class="item"><div class="top"><span class="name">' + esc(x.desc) + '</span><span class="chip ok">تم الدفع ✓</span></div>' +
      '<div class="meta">الإسهام ' + money(x.amount) + ' · تاريخ الدفع ' + esc(x.paidOn || '-') + ' · الموعد ' + esc(x.due) + '</div><div class="pb"><i style="width:100%"></i></div></div>';
    h += '<div class="card"><h2>المشاريع المدفوعة</h2>' + d.done.slice(0, 3).map(drow).join('');
    if (d.done.length > 3) h += '<div id="moreDone" hidden>' + d.done.slice(3).map(drow).join('') + '</div><button class="copy" id="showDone">عرض الكل (' + d.done.length + ')</button>';
    h += '</div>';
  }

  if (d.claims && d.claims.length) {
    const CS = { pending: ['قيد المراجعة ⏳', 'wait'], confirmed: ['تم التأكيد ✓', 'ok'], rejected: ['مرفوض', 'rej'] };
    const crow = c => '<div class="prow"><div><div class="pn">' + esc(c.desc) + '</div><div class="mut">' + esc(c.date) + ' · ' + money(c.amount) + '</div>' +
      (c.note ? '<div class="mut" style="color:var(--bad);white-space:pre-line">' + esc(c.note) + '</div>' : '') +
      '</div><span class="chip ' + CS[c.status][1] + '">' + CS[c.status][0] + '</span></div>';
    h += '<div class="card"><h2>إيصالاتك</h2>' + d.claims.slice(0, 5).map(crow).join('');
    if (d.claims.length > 5) h += '<div id="moreCl" hidden>' + d.claims.slice(5).map(crow).join('') + '</div><button class="copy" id="showCl">عرض الكل (' + d.claims.length + ')</button>';
    h += '</div>';
  }

  if (d.payments.length) {
    const names = {}; d.items.forEach(i => names[String(i.code)] = i.desc);
    const pays = d.payments.slice().sort((x, y) => String(y.date).localeCompare(String(x.date)));
    const row = p => '<div class="prow"><div><div class="pn">' + esc(names[String(p.code)] || p.code) + '</div><div class="mut">' + esc(p.date) + '</div></div><b class="pa">' + money(p.amount) + ' ✓</b></div>';
    h += '<div class="card"><h2>مساهماتك</h2>' + pays.slice(0, 5).map(row).join('');
    if (pays.length > 5) h += '<div id="morePays" hidden>' + pays.slice(5).map(row).join('') + '</div><button class="copy" id="showAll">عرض كل الدفعات (' + pays.length + ')</button>';
    h += '</div>';
  }

  if (d.expenses && d.expenses.length) {
    const erow = e => '<div class="prow"><div><div class="pn">' + esc(e.desc) + '</div><div class="mut">' + esc(e.date) + '</div>' +
      (e.details ? '<div class="mut" style="white-space:pre-line;margin-top:2px">' + esc(e.details) + '</div>' : '') +
      '</div><b>' + money(e.amount) + '</b></div>';
    h += '<div class="card"><h2>مصروفات الصيانة</h2>' + d.expenses.slice(0, 5).map(erow).join('');
    if (d.expenses.length > 5) h += '<div id="moreExp" hidden>' + d.expenses.slice(5).map(erow).join('') + '</div><button class="copy" id="showExp">عرض كل المصروفات (' + d.expenses.length + ')</button>';
    h += '</div>';
  }

  if (d.fund !== null && d.fund !== undefined) h += '<div class="card fund"><div class="ic">🛠️</div><div><span class="mut">رصيد صندوق الصيانة</span><b>' + money(d.fund) + '</b></div></div>';
  (d.project || []).forEach(p => {
    const pct = p.required ? Math.min(100, Math.round(p.collected / p.required * 100)) : 0;
    h += '<div class="card"><h2>' + esc(p.desc) + '</h2><div class="mut">تم تحصيل ' + money(p.collected) + ' من ' + money(p.required) + ' (' + pct + '%)</div><div class="pb" style="margin-top:10px"><i style="width:' + pct + '%"></i></div></div>';
  });
  h += '<button class="out" id="out">تسجيل الخروج</button>';

  $('view').innerHTML = h;
  $('login').hidden = true;
  $('view').hidden = false;
  window.scrollTo(0, 0);

  $('out').onclick = () => { clear(); history.replaceState(null, '', location.pathname); location.reload(); };
  document.querySelectorAll('.paid-btn[data-code]').forEach(b => b.onclick = () => askAmount(b));
  const se = $('showExp');
  if (se) se.onclick = () => { $('moreExp').hidden = false; se.hidden = true; };
  const sd = $('showDone');
  if (sd) sd.onclick = () => { $('moreDone').hidden = false; sd.hidden = true; };
  const sc = $('showCl');
  if (sc) sc.onclick = () => { $('moreCl').hidden = false; sc.hidden = true; };
  const sa = $('showAll');
  if (sa) sa.onclick = () => { $('morePays').hidden = false; sa.hidden = true; };
  document.querySelectorAll('[data-copy]').forEach(c => c.onclick = async () => {
    const t = (s.pay || [])[Number(c.dataset.copy)].number;
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x);
      x.select(); document.execCommand('copy'); x.remove();
    }
    c.textContent = 'تم النسخ ✓'; setTimeout(() => c.textContent = 'نسخ الرقم', 1800);
  });
}

$('go').onclick = () => login(nd($('apt').value), nd($('pin').value));
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

const q = new URLSearchParams(location.search);
if (q.get('apt') && q.get('pin')) {
  login(q.get('apt'), q.get('pin'));
} else {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.a && s.p) login(s.a, s.p, true);
  } catch (e) {}
}
</script>
</body>
</html>
